<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دُمبلة الشرقاط</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      margin: 60px auto;
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #374151;
    }

    .secondary:hover {
      background: #4b5563;
    }

    #رسالة {
      margin-top: 15px;
      min-height: 25px;
    }

    #الحساب {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎮 دُمبلة الشرقاط</h1>

    <!-- التسجيل -->
    <div id="التسجيل">

      <h2>إنشاء حساب</h2>

      <input
        id="ايميل_جديد"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="كلمة_جديدة"
        type="password"
        placeholder="كلمة المرور"
      >

      <button type="button" onclick="إنشاء_حساب()">
        إنشاء حساب
      </button>

      <button
        type="button"
        class="secondary"
        onclick="إظهار_الدخول()"
      >
        عندك حساب؟ تسجيل الدخول
      </button>

    </div>


    <!-- الدخول -->
    <div id="الدخول" style="display:none;">

      <h2>تسجيل الدخول</h2>

      <input
        id="ايميل_الدخول"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="كلمة_الدخول"
        type="password"
        placeholder="كلمة المرور"
      >

      <button type="button" onclick="دخول()">
        تسجيل الدخول
      </button>

      <button
        type="button"
        class="secondary"
        onclick="إظهار_التسجيل()"
      >
        إنشاء حساب جديد
      </button>

    </div>


    <!-- الحساب -->
    <div id="الحساب">

      <h2>👤 حسابك</h2>

      <p id="معلومات_الحساب"></p>

      <button
        type="button"
        class="secondary"
        onclick="خروج()"
      >
        تسجيل الخروج
      </button>

    </div>

    <div id="رسالة"></div>

  </div>


<script>

// ================================
// بيانات Supabase
// ================================

const رابط_المشروع =
  "https://qztqgxwfryoispaxqaly.supabase.co";

const المفتاح_القابل_للنشر =
  "sb_publishable_ufCS6pN3gp-wPv-DrmWshA_3Z678s6L";

const قاعدة_البيانات = supabase.createClient(
  رابط_المشروع,
  المفتاح_القابل_للنشر
);


// ================================
// إظهار التسجيل
// ================================

function إظهار_التسجيل() {

  document.getElementById("التسجيل").style.display = "block";
  document.getElementById("الدخول").style.display = "none";
  document.getElementById("الحساب").style.display = "none";

  document.getElementById("رسالة").innerText = "";
}


// ================================
// إظهار الدخول
// ================================

function إظهار_الدخول() {

  document.getElementById("التسجيل").style.display = "none";
  document.getElementById("الدخول").style.display = "block";
  document.getElementById("الحساب").style.display = "none";

  document.getElementById("رسالة").innerText = "";
}


// ================================
// إنشاء حساب
// ================================

async function إنشاء_حساب() {

  const الايميل =
    document.getElementById("ايميل_جديد").value.trim();

  const كلمة_المرور =
    document.getElementById("كلمة_جديدة").value;

  const الرسالة =
    document.getElementById("رسالة");

  if (!الايميل || !كلمة_المرور) {

    الرسالة.innerText =
      "⚠️ اكتب البريد الإلكتروني وكلمة المرور";

    return;
  }

  الرسالة.innerText =
    "⏳ جاري إنشاء الحساب...";

  const { data, error } =
    await قاعدة_البيانات.auth.signUp({
      email: الايميل,
      password: كلمة_المرور
    });

  if (error) {

    الرسالة.innerText =
      "❌ " + error.message;

    return;
  }

  الرسالة.innerText =
    "✅ تم إنشاء الحساب بنجاح";

  document.getElementById("ايميل_جديد").value = "";
  document.getElementById("كلمة_جديدة").value = "";
}


// ================================
// تسجيل الدخول
// ================================

async function دخول() {

  const الايميل =
    document.getElementById("ايميل_الدخول").value.trim();

  const كلمة_المرور =
    document.getElementById("كلمة_الدخول").value;

  const الرسالة =
    document.getElementById("رسالة");

  if (!الايميل || !كلمة_المرور) {

    الرسالة.innerText =
      "⚠️ اكتب البريد الإلكتروني وكلمة المرور";

    return;
  }

  الرسالة.innerText =
    "⏳ جاري تسجيل الدخول...";

  const { data, error } =
    await قاعدة_البيانات.auth.signInWithPassword({
      email: الايميل,
      password: كلمة_المرور
    });

  if (error) {

    الرسالة.innerText =
      "❌ " + error.message;

    return;
  }

  الرسالة.innerText = "";

  إظهار_الحساب();

  document.getElementById("معلومات_الحساب").innerText =
    "البريد الإلكتروني: " + data.user.email;
}


// ================================
// إظهار الحساب
// ================================

async function إظهار_الحساب() {

  document.getElementById("التسجيل").style.display = "none";
  document.getElementById("الدخول").style.display = "none";
  document.getElementById("الحساب").style.display = "block";

  const { data } =
    await قاعدة_البيانات.auth.getUser();

  if (data.user) {

    document.getElementById("معلومات_الحساب").innerText =
      "البريد الإلكتروني: " + data.user.email;
  }
}


// ================================
// تسجيل الخروج
// ================================

async function خروج() {

  await قاعدة_البيانات.auth.signOut();

  document.getElementById("الحساب").style.display = "none";

  إظهار_الدخول();

  document.getElementById("رسالة").innerText =
    "✅ تم تسجيل الخروج";
}


// ================================
// فحص إذا المستخدم داخل مسبقاً
// ================================

async function فحص_الحساب() {

  const { data } =
    await قاعدة_البيانات.auth.getUser();

  if (data.user) {

    إظهار_الحساب();

  } else {

    إظهار_التسجيل();

  }
}

فحص_الحساب();

</script>

</body>
</html>
