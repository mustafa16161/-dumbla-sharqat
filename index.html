<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دُمبلة الشرقاط</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10141c;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: auto;
      padding: 30px 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #1b2230;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #2a3344;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2f80ed;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #394354;
    }

    .danger {
      background: #c0392b;
    }

    .balance {
      text-align: center;
      padding: 25px 10px;
    }

    .balance-title {
      font-size: 17px;
      color: #b9c0cc;
    }

    .balance-number {
      font-size: 35px;
      font-weight: bold;
      margin-top: 10px;
    }

    .balance-currency {
      font-size: 16px;
      color: #b9c0cc;
    }

    .menu-button {
      text-align: right;
      font-size: 17px;
    }

    .hidden {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #ffcc66;
      min-height: 20px;
    }

    .user-email {
      text-align: center;
      color: #aaa;
      margin-bottom: 15px;
      word-break: break-all;
    }

    .small {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎮 دُمبلة الشرقاط</h1>

    <!-- تسجيل الدخول -->
    <div id="صفحة_الدخول" class="card">

      <h2>تسجيل الدخول</h2>

      <input
        id="ايميل_الدخول"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="كلمة_الدخول"
        type="password"
        placeholder="كلمة المرور"
      >

      <button onclick="دخول()">تسجيل الدخول</button>

      <button class="secondary" onclick="إظهار_التسجيل()">
        إنشاء حساب جديد
      </button>

      <div id="رسالة_الدخول" class="message"></div>

    </div>


    <!-- إنشاء حساب -->
    <div id="صفحة_التسجيل" class="card hidden">

      <h2>إنشاء حساب</h2>

      <input
        id="ايميل_جديد"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="كلمة_جديدة"
        type="password"
        placeholder="كلمة المرور"
      >

      <button onclick="إنشاء_حساب()">إنشاء الحساب</button>

      <button class="secondary" onclick="إظهار_الدخول()">
        الرجوع لتسجيل الدخول
      </button>

      <div id="رسالة_التسجيل" class="message"></div>

    </div>


    <!-- الحساب -->
    <div id="صفحة_الحساب" class="hidden">

      <div class="card">

        <div class="user-email" id="ايميل_المستخدم"></div>

        <div class="balance">

          <div class="balance-title">
            💰 رصيد الحساب
          </div>

          <div class="balance-number" id="الرصيد">
            0
          </div>

          <div class="balance-currency">
            دينار عراقي
          </div>

        </div>

      </div>


      <!-- الأزرار -->

      <div class="card">

        <button onclick="فتح_الإيداع()" class="menu-button">
          ➕ إيداع
        </button>

        <button onclick="فتح_السحب()" class="menu-button">
          💸 سحب
        </button>

        <button onclick="فتح_الإعدادات()" class="menu-button">
          ⚙️ الإعدادات
        </button>

        <button onclick="خروج()" class="danger menu-button">
          🚪 تسجيل الخروج
        </button>

      </div>


      <!-- الإيداع -->

      <div id="صفحة_الإيداع" class="card hidden">

        <h2>➕ طلب إيداع</h2>

        <input
          id="مبلغ_الإيداع"
          type="number"
          placeholder="أدخل مبلغ الإيداع"
        >

        <input
          id="ملاحظة_الإيداع"
          type="text"
          placeholder="ملاحظة اختيارية"
        >

        <button onclick="إرسال_إيداع()">
          إرسال طلب الإيداع
        </button>

        <button
          class="secondary"
          onclick="إغلاق_النماذج()">
          إلغاء
        </button>

        <div id="رسالة_الإيداع" class="message"></div>

      </div>


      <!-- السحب -->

      <div id="صفحة_السحب" class="card hidden">

        <h2>💸 طلب سحب</h2>

        <input
          id="مبلغ_السحب"
          type="number"
          placeholder="أدخل مبلغ السحب"
        >

        <input
          id="ملاحظة_السحب"
          type="text"
          placeholder="ملاحظة الطلب"
        >

        <button onclick="إرسال_سحب()">
          إرسال طلب السحب
        </button>

        <button
          class="secondary"
          onclick="إغلاق_النماذج()">
          إلغاء
        </button>

        <div id="رسالة_السحب" class="message"></div>

      </div>


      <!-- الإعدادات -->

      <div id="صفحة_الإعدادات" class="card hidden">

        <h2>⚙️ الإعدادات</h2>

        <p class="small">
          البريد الإلكتروني للحساب:
        </p>

        <p id="ايميل_الإعدادات"></p>

        <button
          class="secondary"
          onclick="إغلاق_النماذج()">
          رجوع
        </button>

      </div>

    </div>

  </div>


<script>

  /* بيانات Supabase */

  const رابط_المشروع =
    "https://qztqgxwfryoispaxqaly.supabase.co";

  const المفتاح_القابل_للنشر =
    "sb_publishable_ufCS6pN3gp-wPv-DrmWshA_3Z678s6L";

  const قاعدة_البيانات =
    supabase.createClient(
      رابط_المشروع,
      المفتاح_القابل_للنشر
    );


  /* إظهار التسجيل */

  function إظهار_التسجيل() {

    document
      .getElementById("صفحة_الدخول")
      .classList.add("hidden");

    document
      .getElementById("صفحة_التسجيل")
      .classList.remove("hidden");

  }


  /* إظهار الدخول */

  function إظهار_الدخول() {

    document
      .getElementById("صفحة_التسجيل")
      .classList.add("hidden");

    document
      .getElementById("صفحة_الدخول")
      .classList.remove("hidden");

  }


  /* إنشاء حساب */

  async function إنشاء_حساب() {

    const الايميل =
      document.getElementById("ايميل_جديد").value.trim();

    const كلمة_المرور =
      document.getElementById("كلمة_جديدة").value;

    const الرسالة =
      document.getElementById("رسالة_التسجيل");


    if (!الايميل || !كلمة_المرور) {

      الرسالة.textContent =
        "اكتب البريد الإلكتروني وكلمة المرور";

      return;
    }


    الرسالة.textContent =
      "جاري إنشاء الحساب...";


    const { data, error } =
      await قاعدة_البيانات.auth.signUp({

        email: الايميل,

        password: كلمة_المرور

      });


    if (error) {

      الرسالة.textContent =
        "خطأ: " + error.message;

      return;
    }


    الرسالة.textContent =
      "تم إنشاء الحساب بنجاح. يمكنك تسجيل الدخول الآن.";

  }


  /* تسجيل الدخول */

  async function دخول() {

    const الايميل =
      document.getElementById("ايميل_الدخول").value.trim();

    const كلمة_المرور =
      document.getElementById("كلمة_الدخول").value;

    const الرسالة =
      document.getElementById("رسالة_الدخول");


    if (!الايميل || !كلمة_المرور) {

      الرسالة.textContent =
        "اكتب البريد الإلكتروني وكلمة المرور";

      return;
    }


    الرسالة.textContent =
      "جاري تسجيل الدخول...";


    const { data, error } =
      await قاعدة_البيانات.auth.signInWithPassword({

        email: الايميل,

        password: كلمة_المرور

      });


    if (error) {

      الرسالة.textContent =
        "بيانات تسجيل الدخول غير صحيحة";

      return;
    }


    الرسالة.textContent = "";

    await إظهار_الحساب(data.user);

  }


  /* إظهار الحساب */

  async function إظهار_الحساب(المستخدم) {

    document
      .getElementById("صفحة_الدخول")
      .classList.add("hidden");

    document
      .getElementById("صفحة_التسجيل")
      .classList.add("hidden");

    document
      .getElementById("صفحة_الحساب")
      .classList.remove("hidden");


    document
      .getElementById("ايميل_المستخدم")
      .textContent =
        المستخدم.email;


    document
      .getElementById("ايميل_الإعدادات")
      .textContent =
        المستخدم.email;


    await فحص_الحساب(المستخدم.id);

  }


  /* جلب الرصيد */

  async function فحص_الحساب(معرف_المستخدم) {

    const { data, error } =
      await قاعدة_البيانات
        .from("accounts")
        .select("balance")
        .eq("user_id", معرف_المستخدم)
        .maybeSingle();


    if (error) {

      console.log(error);

      document
        .getElementById("الرصيد")
        .textContent = "0";

      return;
    }


    if (data) {

      document
        .getElementById("الرصيد")
        .textContent =
          Number(data.balance || 0).toLocaleString("ar-IQ");

    } else {

      document
        .getElementById("الرصيد")
        .textContent = "0";

    }

  }


  /* فتح الإيداع */

  function فتح_الإيداع() {

    إغلاق_النماذج();

    document
      .getElementById("صفحة_الإيداع")
      .classList.remove("hidden");

  }


  /* فتح السحب */

  function فتح_السحب() {

    إغلاق_النماذج();

    document
      .getElementById("صفحة_السحب")
      .classList.remove("hidden");

  }


  /* فتح الإعدادات */

  function فتح_الإعدادات() {

    إغلاق_النماذج();

    document
      .getElementById("صفحة_الإعدادات")
      .classList.remove("hidden");

  }


  /* إغلاق النماذج */

  function إغلاق_النماذج() {

    document
      .getElementById("صفحة_الإيداع")
      .classList.add("hidden");

    document
      .getElementById("صفحة_السحب")
      .classList.add("hidden");

    document
      .getElementById("صفحة_الإعدادات")
      .classList.add("hidden");

  }


  /* إرسال طلب إيداع */

  async function إرسال_إيداع() {

    const المبلغ =
      Number(
        document.getElementById("مبلغ_الإيداع").value
      );

    const الملاحظة =
      document.getElementById("ملاحظة_الإيداع").value;

    const الرسالة =
      document.getElementById("رسالة_الإيداع");


    if (!المبلغ || المبلغ <= 0) {

      الرسالة.textContent =
        "أدخل مبلغ صحيح";

      return;
    }


    const { data: جلسة } =
      await قاعدة_البيانات.auth.getSession();


    const المستخدم =
      جلسة.session?.user;


    if (!المستخدم) {

      الرسالة.textContent =
        "يجب تسجيل الدخول أولاً";

      return;
    }


    الرسالة.textContent =
      "جاري إرسال الطلب...";


    const { error } =
      await قاعدة_البيانات
        .from("transactions")
        .insert({

          user_id: المستخدم.id,

          type: "deposit",

          amount: المبلغ,

          status: "pending",

          note: الملاحظة

        });


    if (error) {

      console.log(error);

      الرسالة.textContent =
        "حدث خطأ أثناء إرسال الطلب";

      return;
    }


    الرسالة.textContent =
      "تم إرسال طلب الإيداع بنجاح، انتظر مراجعة الطلب.";

    document
      .getElementById("مبلغ_الإيداع")
      .value = "";

    document
      .getElementById("ملاحظة_الإيداع")
      .value = "";

  }


  /* إرسال طلب سحب */

  async function إرسال_سحب() {

    const المبلغ =
      Number(
        document.getElementById("مبلغ_السحب").value
      );

    const الملاحظة =
      document.getElementById("ملاحظة_السحب").value;

    const الرسالة =
      document.getElementById("رسالة_السحب");


    if (!المبلغ || المبلغ <= 0) {

      الرسالة.textContent =
        "أدخل مبلغ صحيح";

      return;
    }


    const { data: جلسة } =
      await قاعدة_البيانات.auth.getSession();


    const المستخدم =
      جلسة.session?.user;


    if (!المستخدم) {

      الرسالة.textContent =
        "يجب تسجيل الدخول أولاً";

      return;
    }


    /* نتحقق من الرصيد قبل إرسال طلب السحب */

    const { data: الحساب, error: خطأ_الحساب } =
      await قاعدة_البيانات
        .from("accounts")
        .select("balance")
        .eq("user_id", المستخدم.id)
        .maybeSingle();


    if (خطأ_الحساب) {

      الرسالة.textContent =
        "تعذر قراءة الرصيد";

      return;
    }


    const الرصيد_الحالي =
      Number(الحساب?.balance || 0);


    if (المبلغ > الرصيد_الحالي) {

      الرسالة.textContent =
        "الرصيد غير كافٍ";

      return;
    }


    الرسالة.textContent =
      "جاري إرسال الطلب...";


    const { error } =
      await قاعدة_البيانات
        .from("transactions")
        .insert({

          user_id: المستخدم.id,

          type: "withdrawal",

          amount: المبلغ,

          status: "pending",

          note: الملاحظة

        });


    if (error) {

      console.log(error);

      الرسالة.textContent =
        "حدث خطأ أثناء إرسال الطلب";

      return;
    }


    الرسالة.textContent =
      "تم إرسال طلب السحب بنجاح، انتظر مراجعة الطلب.";

    document
      .getElementById("مبلغ_السحب")
      .value = "";

    document
      .getElementById("ملاحظة_السحب")
      .value = "";

  }


  /* تسجيل الخروج */

  async function خروج() {

    await قاعدة_البيانات.auth.signOut();

    document
      .getElementById("صفحة_الحساب")
      .classList.add("hidden");

    document
      .getElementById("صفحة_الدخول")
      .classList.remove("hidden");

  }


  /* فحص المستخدم عند فتح الموقع */

  async function تشغيل() {

    const { data } =
      await قاعدة_البيانات.auth.getSession();


    if (data.session?.user) {

      await إظهار_الحساب(
        data.session.user
      );

    }

  }


  تشغيل();

</script>

</body>
</html>
