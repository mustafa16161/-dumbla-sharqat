<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دُمبلة الشرقاط</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }
    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background: #222;
      border-radius: 15px;
    }
    h1 {
      color: #ffd700;
    }
    input {
      width: 90%;
      padding: 13px;
      margin: 7px;
      border: 0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 94%;
      padding: 13px;
      margin: 7px;
      border: 0;
      border-radius: 8px;
      background: #ffd700;
      color: #111;
      font-weight: bold;
    }
    .مخفي {
      display: none;
    }
    #رسالة {
      margin-top: 15px;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎮 دُمبلة الشرقاط</h1>
    <div id="تسجيل">
      <h2>تسجيل الدخول</h2>
      <input id="ايميل_الدخول" type="email" placeholder="البريد الإلكتروني">
      <input id="كلمة_الدخول" type="password" placeholder="كلمة المرور">
      <button onclick="دخول()">دخول</button>
      <button onclick="إظهار_التسجيل()">إنشاء حساب جديد</button>
    </div>
    <div id="إنشاء" class="مخفي">
      <h2>إنشاء حساب</h2>
      <input id="ايميل_جديد" type="email" placeholder="البريد الإلكتروني">
      <input id="كلمة_جديدة" type="password" placeholder="كلمة المرور">
      <button onclick="إنشاء_حساب()">إنشاء الحساب</button>
      <button onclick="إظهار_الدخول()">رجوع</button>
    </div>
    <div id="الحساب" class="مخفي">
      <h2>حسابي</h2>
      <p id="معلومات_الحساب"></p>
      <button onclick="خروج()">تسجيل الخروج</button>
    </div>
    <p id="رسالة"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /*
      ضع بيانات Supabase هنا:
      1) رابط المشروع
      2) المفتاح القابل للنشر
    */
    const رابط_المشروع = "ضع_رابط_المشروع_هنا";
    const المفتاح_القابل_للنشر = "ضع_المفتاح_هنا";
    const قاعدة_البيانات = supabase.createClient(
      رابط_المشروع,
      المفتاح_القابل_للنشر
    );
    function إظهار_التسجيل() {
      document.getElementById("تسجيل").classList.add("مخفي");
      document.getElementById("إنشاء").classList.remove("مخفي");
      document.getElementById("رسالة").textContent = "";
    }
    function إظهار_الدخول() {
      document.getElementById("إنشاء").classList.add("مخفي");
      document.getElementById("تسجيل").classList.remove("مخفي");
      document.getElementById("رسالة").textContent = "";
    }
    async function إنشاء_حساب() {
      const البريد = document.getElementById("ايميل_جديد").value;
      const كلمة_المرور = document.getElementById("كلمة_جديدة").value;
      const { error } = await قاعدة_البيانات.auth.signUp({
        email: البريد,
        password: كلمة_المرور
      });
      if (error) {
        document.getElementById("رسالة").textContent = error.message;
        return;
      }
      document.getElementById("رسالة").textContent =
        "تم إنشاء الحساب بنجاح.";
    }
    async function دخول() {
      const البريد = document.getElementById("ايميل_الدخول").value;
      const كلمة_المرور = document.getElementById("كلمة_الدخول").value;
      const { data, error } =
        await قاعدة_البيانات.auth.signInWithPassword({
          email: البريد,
          password: كلمة_المرور
        });
      if (error) {
        document.getElementById("رسالة").textContent = error.message;
        return;
      }
      إظهار_الحساب(data.user);
    }
    function إظهار_الحساب(المستخدم) {
      document.getElementById("تسجيل").classList.add("مخفي");
      document.getElementById("إنشاء").classList.add("مخفي");
      document.getElementById("الحساب").classList.remove("مخفي");
      document.getElementById("معلومات_الحساب").textContent =
        "الحساب: " + المستخدم.email;
    }
    async function خروج() {
      await قاعدة_البيانات.auth.signOut();
      document.getElementById("الحساب").classList.add("مخفي");
      document.getElementById("تسجيل").classList.remove("مخفي");
    }
  </script>
</body>sb_publishable_ufCS6pN3gp-wPv-DrmWshA_3Z678s6L
</html>
